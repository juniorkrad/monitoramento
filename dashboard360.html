<!-- dashboard360.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard 360 - NOC</title>
    
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="dashboard360.css">
</head>
<body>

    <div class="page-container">
        <div id="header-placeholder"></div>

        <main class="main-content" style="flex-direction: column;">
            <div class="grid-container" id="dashboard-container">
                <div style="grid-column: 1/-1; text-align: center; color: var(--m3-on-surface-variant); padding: 40px 0;">
                    <span class="material-symbols-rounded" style="font-size: 48px; display: block; margin-bottom: 10px; animation: textFlash 1.5s infinite;">sync</span>
                    <h2>Sincronizando dados da rede...</h2>
                </div>
            </div>
        </main>
    </div>

    <div id="super-modal" class="modal-overlay">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h3 id="modal-title" style="margin: 0; display: flex; align-items: center; gap: 8px; color: var(--m3-on-surface);">
                    <span class="material-symbols-rounded">dns</span> OLT Detalhes
                </h3>
                <div style="display: flex; gap: 15px; align-items: center;">
                    <button class="close-btn" style="background: none; border: none; color: var(--m3-on-surface-variant); cursor: pointer; font-size: 24px;" onclick="Dashboard360Engine.closeModal()">&times;</button>
                </div>
            </div>
            <div class="modal-body">
                
                <div id="view-placas">
                    <div class="placas-grid" id="placas-container"></div>
                </div>

                <div id="view-portas" style="display: none;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                        <button id="btn-back" class="btn-voltar-placas" style="margin-bottom: 0;" onclick="Dashboard360Engine.showPlacas()">
                            <span class="material-symbols-rounded">arrow_back</span> Voltar para Placas
                        </button>
                    </div>

                    <div class="table-container">
                        <table class="noc-table">
                            <thead>
                                <tr class="table-header-row">
                                    <th>PORTAS</th>
                                    <th>CIRCUITOS</th>
                                    <th>BAIRROS</th>
                                    <th style="text-align: center;">REDE</th>
                                    <th style="text-align: center;">ENERGIA</th>
                                    <th style="text-align: center;">POTÊNCIA</th>
                                </tr>
                            </thead>
                            <tbody id="portas-tbody"></tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="config.js"></script>
    <script src="api-service.js"></script>
    <script src="data-mapper.js"></script>
    <script src="data-store.js"></script>
    <script src="layout.js"></script>
    
    <script src="olt-engine.js"></script>
    <script src="energia-engine.js"></script>
    <script src="potencia-engine.js"></script>
    <script src="temperatura-engine.js"></script>
    <script src="dashboard360-engine.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof loadHeader === 'function') loadHeader({ title: "Dashboard 360", exactTitle: true });
            if (typeof loadFooter === 'function') loadFooter();
            if (typeof updateGlobalTimestamp === 'function') updateGlobalTimestamp(); 
        });
    </script>
</body>
</html>
